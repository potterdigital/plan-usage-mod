name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest Claude Code, to hear about API changes before users do.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the mod is tested on; `latest` runs only on the schedule and by hand.
        claude-code: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["2.1.289","latest"]') || fromJSON('["2.1.289"]') }}
    name: Claude Code ${{ matrix.claude-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Claude Code and Prettier
        run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude-code }} prettier@3.9.9
      - name: Validate the plugin and marketplace (warnings fail the run)
        run: claude plugin validate --strict .
      - name: Run the tests
        run: claude plugin test .
      - name: Check formatting
        run: prettier --check .
